<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un regalo para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Caveat:wght@500;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ff:'Dancing Script';--ink:#3b2a24;--card:#fffaf3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f3e6dc;--card:#2a1f24}}
:root[data-theme="dark"]{--ink:#f3e6dc;--card:#2a1f24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#1d1530;font-family:'Cormorant Garamond',Georgia,serif;color:#fff;overflow:hidden}
#pin{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .7s}
.box{background:var(--card);color:var(--ink);padding:28px 24px;border-radius:18px;width:min(92vw,340px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.box h1{font:700 30px 'Dancing Script',cursive;margin:0 0 4px}
.box p{margin:0 0 16px;font-size:18px}
input{width:100%;box-sizing:border-box;font:700 20px 'Cormorant Garamond',serif;letter-spacing:.15em;text-align:center;padding:12px;border-radius:10px;border:1px solid rgba(128,128,128,.45);background:transparent;color:inherit;text-transform:uppercase}
button.go{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:#c2185b;color:#fff;font:700 19px 'Cormorant Garamond',serif;cursor:pointer}
#er{min-height:1.3em;margin-top:8px;color:#d6335e;font-size:16px}
.box small{opacity:.65;font-size:14px}
#s{display:none;width:100%;height:100%}#s.on{display:block}
#seed{animation:fall 1.3s cubic-bezier(.5,0,1,.6) forwards,gone .4s 1.5s forwards}
@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(590px)}}
@keyframes gone{to{opacity:0}}
#rain{opacity:0;transition:opacity .5s}#rain.on{opacity:1}
.r{animation:rn .8s linear infinite}
@keyframes rn{from{transform:translateY(-30px)}to{transform:translateY(640px)}}
.st{fill:none;stroke:#3f7d3a;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.go .st{animation:draw 1.6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.h{transform:scale(0);transform-box:fill-box;transform-origin:center}
.go .h{animation:pop .7s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes pop{to{transform:scale(1)}}
#paper{opacity:0;transform:translateY(70px)}
#paper.go{animation:up 1s ease-out forwards}
@keyframes up{to{opacity:1;transform:none}}
#env{opacity:0;transform:translateY(-420px);cursor:pointer}
#env.go{animation:drop 1s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes drop{to{opacity:1;transform:none}}
.flap,.pk,.sl,.sr{transform-box:fill-box;transition:transform .9s,opacity .6s}
.flap{transform-origin:50% 0}
.open .flap{transform:scaleY(-1)}
.open .flap path{fill:#c39a5f}
.pk{transition-delay:.5s}.open .pk{transform:translateY(-38px)}
.open .sl{transform:translate(-9px,6px) rotate(-25deg);opacity:0}
.open .sr{transform:translate(9px,6px) rotate(25deg);opacity:0}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font:700 26px 'Dancing Script',cursive;opacity:0;transition:opacity 1s;pointer-events:none}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,5,20,.55);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));perspective:1200px;z-index:5}
#ov.on{display:flex}
#ct{position:relative;width:min(92vw,460px);max-height:80vh;overflow:auto;box-sizing:border-box;padding:30px 26px 24px;border-radius:6px;color:#3b2a24;transform-origin:top center;animation:unf 1.1s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 24px 70px rgba(0,0,0,.5)}
@keyframes unf{from{transform:rotateX(-88deg) translateY(40px);opacity:0}to{transform:none;opacity:1}}
.antiguo{background:radial-gradient(ellipse at center,#f6e7c1 55%,#d9b97a 100%)}
.pergamino{background:linear-gradient(#ead7a6,#dcc48b);border:3px double #a67c3d}
.minimal{background:#fff;color:#222}
#ct h2{font:700 32px var(--ff),cursive;margin:0 0 12px}
#msg{font:500 23px/1.5 var(--ff),cursive;white-space:pre-line}
#sg{font:700 24px var(--ff),cursive;text-align:right;margin:16px 0 0}
#x{position:absolute;top:6px;right:10px;border:0;background:none;font-size:30px;line-height:1;color:inherit;cursor:pointer;opacity:.6}
.rosado{background:#ffe3ec;border:2px solid #f2a1b8}
.noche{background:linear-gradient(#26264a,#151534);color:#f3e9d0}
.pv :not(#ct){animation:none!important;transition:none!important}
.pv .h{transform:none}.pv .st{stroke-dashoffset:0}.pv #paper,.pv #env{opacity:1;transform:none}.pv #seed,.pv #hint{display:none}
@media(prefers-reduced-motion:reduce){.r{animation:none}}
</style></head><body>
<div id="pin"><div class="box"><h1>Tienes un regalo</h1><p>Escribe tu PIN para abrirlo</p>
<input id="pi" maxlength="12" autocomplete="off" placeholder="XXXX-XXXX"><div id="er"></div>
<button class="go" id="bt">Abrir regalo</button></div></div>

<svg id="s" viewBox="0 0 400 640" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="200" cy="620" rx="125" ry="20" fill="#3d2616"/><ellipse cx="200" cy="614" rx="110" ry="13" fill="#5d3b25"/>
<ellipse id="seed" cx="200" cy="0" rx="5" ry="8" fill="#7a4d26"/>
<g id="fl"></g>
<g id="paper"><path style="fill:var(--pp)" d="M62 345Q200 400 338 345L228 614H172Z"/><path style="fill:var(--p3);opacity:.55" d="M200 398L228 614H172Z"/><path style="fill:var(--p2)" d="M62 345Q200 400 338 345L306 372Q200 428 94 372Z"/><rect style="fill:var(--lz)" x="166" y="508" width="68" height="11" rx="3"/><path style="fill:var(--lz)" d="M200 514Q160 480 168 516Q166 542 200 514Q240 480 232 516Q234 542 200 514Z"/><circle cx="200" cy="514" r="6" style="fill:var(--lz);stroke:rgba(0,0,0,.25)"/></g>
<g transform="translate(125 318)"><g id="env">
<rect x="3" y="6" width="150" height="96" rx="3" fill="rgba(0,0,0,.3)"/>
<rect width="150" height="96" rx="3" fill="#e0c08e" stroke="#b8945f"/>
<rect class="pk" x="12" y="8" width="126" height="70" fill="#fffaf0"/>
<path d="M0 0L76 54L0 96Z" fill="#d6b27c"/><path d="M150 0L74 54L150 96Z" fill="#d6b27c"/><path d="M0 96L76 44L150 96Z" fill="#e8cc9c" stroke="#b8945f" stroke-width=".6"/>
<g class="flap"><path d="M0 0H150L75 60Z" fill="#d3ad72" stroke="#b8945f"/></g>
<path class="sl" d="M75 43a12 12 0 0 0 0 24z" fill="#b3202a"/><path class="sr" d="M75 43a12 12 0 0 1 0 24z" fill="#c62d38"/>
</g></g>
<g id="rain"></g>
</svg>
<div id="hint">Toca la carta</div>
<div id="ov"><div id="ct"><button id="x" aria-label="Cerrar">×</button><h2 id="to"></h2><div id="msg"></div><p id="sg"></p></div></div>

<script>
// Datos del regalo: más adelante vendrán de Firebase
const GIFT={pin:'DEMO-2026',para:'María',
mensaje:"Feliz cumpleaños, mi vida.\n\nHoy quise regalarte algo que crece como lo que siento por ti: poco a poco, con cuidado y con muchos colores.\n\nGracias por hacer de cada día un jardín.",
firma:'Con todo mi cariño, Carlos',fondo:['#2b1055','#7597de'],papel:'#f0478f',lazo:'#ffd166',carta:'antiguo',fuente:'Dancing Script',
flores:[{t:'rosa',c:'#d81b3c',n:4},{t:'rosa',c:'#ff8fb1',n:2},{t:'girasol',c:'',n:2},{t:'tulipan',c:'#ff7a3d',n:2},{t:'gerbera',c:'#ff4d2e',n:2},{t:'margarita',c:'',n:3},{t:'lirio',c:'#ffffff',n:1},{t:'iris',c:'#6a3fd1',n:2},{t:'clavel',c:'#ff5fa2',n:2},{t:'hortensia',c:'#8f7bff',n:1},{t:'lavanda',c:'#9b6bd6',n:3}]};
const $=id=>document.getElementById(id);
const sh=(c,p)=>{const n=parseInt(c.slice(1),16),t=p<0?0:255,q=Math.abs(p);return'#'+[n>>16,n>>8&255,n&255].map(v=>Math.round((t-v)*q+v).toString(16).padStart(2,'0')).join('')};
const L=(n,len,w,off,f,r=0)=>Array.from({length:n},(_,i)=>`<ellipse cx="0" cy="${-off-len/2}" rx="${w}" ry="${len/2}" transform="rotate(${r+i*360/n})" fill="${f}" stroke="rgba(0,0,0,.22)" stroke-width=".6"/>`).join('');
const P=(n,c,r=0)=>Array.from({length:n},(_,i)=>`<path d="M0 -3Q10 -16 0 -34Q-10 -16 0 -3" transform="rotate(${r+i*360/n})" fill="${c}" stroke="rgba(0,0,0,.22)" stroke-width=".6"/>`).join('');
const dot=(r,c,x=0,y=0)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const T={
rosa:c=>L(6,13,11,9,sh(c,.12))+L(5,11,9,7,c,20)+L(5,9,8,5,sh(c,-.15),50)+L(4,7,6,2,sh(c,-.3),10)+dot(3,sh(c,-.45)),
girasol:c=>`<g transform="scale(1.15)">${L(20,16,4.5,9,'#f2a900')+L(16,14,4,8,'#ffc823',11)+dot(11,'#5a3a1a')+dot(6,'#3b2410')}</g>`,
tulipan:c=>`<ellipse cx="-7" cy="-4" rx="8" ry="16" transform="rotate(-14)" fill="${sh(c,-.12)}"/><ellipse cx="7" cy="-4" rx="8" ry="16" transform="rotate(14)" fill="${sh(c,-.12)}"/><ellipse cy="-6" rx="9" ry="18" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width=".6"/>`,
gerbera:c=>L(18,17,2.8,7,c)+L(14,13,2.8,6,sh(c,.2),8)+dot(6,'#3a1c1c')+dot(3,'#e9b44c'),
margarita:c=>`<g transform="scale(.9)">${L(13,14,3.4,6,'#fff')+dot(5,'#f5c518')}</g>`,
lirio:c=>`<g transform="scale(.85)">${P(6,c)+P(3,sh(c,-.08),60)+dot(2,'#c98a1b',0,-8)+dot(2,'#c98a1b',6,-4)}</g>`,
iris:c=>L(3,15,9,5,c,180)+L(3,13,6,4,sh(c,.3))+dot(3,'#f2c230'),
clavel:c=>L(16,10,6,6,c)+L(12,8,5,4,sh(c,-.12),10)+L(8,6,4,2,sh(c,-.22),5)+dot(2,sh(c,-.4)),
hortensia:c=>`<g transform="scale(1.1)">${Array.from({length:14},(_,i)=>{const r=Math.sqrt(i)*5.4,a=i*2.4;return`<g transform="translate(${r*Math.cos(a)} ${r*Math.sin(a)})">${L(4,5,3.6,1,i%2?c:sh(c,.22),45)+dot(1,'#f7e27a')}</g>`}).join('')}</g>`,
lavanda:c=>Array.from({length:9},(_,i)=>`<ellipse cx="${i%2?3:-3}" cy="${18-i*4.6}" rx="3" ry="2.3" fill="${i%3?c:sh(c,.22)}"/>`).join('')};

function render(){
// Ramo: se reparte cada flor en un disco, mezclando los tipos
const q=GIFT.flores.map(f=>({...f,k:f.n})),it=[];
while(q.some(f=>f.k>0))q.forEach(f=>{if(f.k>0){it.push(f);f.k--}});
const N=it.length,pts=it.map((f,i)=>{const r=118*Math.sqrt((i+.6)/N),a=i*2.4;return[200+r*Math.cos(a),248+r*Math.sin(a)*.9,f,i]}).sort((a,b)=>a[1]-b[1]);
let st='',hd='',lv='';
for(let k=0;k<9;k++){const a=k*40*Math.PI/180,x=200+Math.cos(a)*112,y=262+Math.sin(a)*100;lv+=`<g class="h" style="animation-delay:${1+k*.1}s"><ellipse cx="${x}" cy="${y}" rx="24" ry="10" transform="rotate(${k*40+90} ${x} ${y})" fill="#2f6b3a"/></g>`}
pts.forEach(([x,y,f,i])=>{const d=i*.09,rot=['tulipan','lavanda'].includes(f.t)?(i%5-2)*9:i*47;
st+=`<path class="st" pathLength="1" d="M200 590Q${200+(x-200)*.3} ${(590+y)/2+40} ${x} ${y}" style="animation-delay:${d}s"/>`;
hd+=`<g transform="translate(${x} ${y}) rotate(${rot})"><g class="h" style="animation-delay:${d+1.3}s">${T[f.t](f.c)}</g></g>`});
$('fl').innerHTML=lv+st+hd;
$('rain').innerHTML=Array.from({length:45},()=>{const x=50+Math.random()*300;return`<line class="r" x1="${x}" x2="${x-2}" y1="0" y2="14" stroke="rgba(190,220,255,.8)" stroke-width="1.6" style="animation-delay:-${Math.random()*.8}s"/>`}).join('');

// Estilos tomados del regalo
const S=$('s').style;S.setProperty('--pp',GIFT.papel);S.setProperty('--p2',sh(GIFT.papel,.25));S.setProperty('--p3',sh(GIFT.papel,-.2));S.setProperty('--lz',GIFT.lazo);
document.body.style.background=`linear-gradient(180deg,${GIFT.fondo[0]},${GIFT.fondo[1]})`;
$('ct').className=GIFT.carta;$('ct').style.setProperty('--ff',"'"+GIFT.fuente+"'");$('to').textContent=GIFT.para?'Para '+GIFT.para+',':'';$('msg').textContent=GIFT.mensaje;$('sg').textContent=GIFT.firma;
}
render();

const TM=[],tt=(f,ms)=>TM.push(setTimeout(f,ms));
function play(){TM.forEach(clearTimeout);TM.length=0;
  $('pin').style.opacity=0;tt(()=>$('pin').style.display='none',700);
  $('s').classList.add('on');
  tt(()=>$('rain').classList.add('on'),1500);
  tt(()=>$('fl').classList.add('go'),3000);
  tt(()=>$('rain').classList.remove('on'),4300);
  tt(()=>$('paper').classList.add('go'),6400);
  tt(()=>{$('env').classList.add('go');$('hint').style.opacity=1},7600);
}
async function tryPin(){let v=$('pi').value.trim().toUpperCase();if(v.length==8)v=v.slice(0,4)+'-'+v.slice(4);
  if(v===GIFT.pin){play();return}
  $('er').textContent='Buscando…';
  try{const g=await window.buscar(v);if(!g){$('er').textContent='PIN incorrecto. Revisa que esté completo.';return}Object.assign(GIFT,g);render();play()}
  catch(e){$('er').textContent=e.code==='permission-denied'?'PIN incorrecto. Revisa que esté completo.':'No se pudo abrir el regalo. Revisa tu conexión.'}
}
$('bt').onclick=tryPin;$('pi').onkeydown=e=>{if(e.key==='Enter')tryPin()};
$('env').onclick=()=>{const e=$('env');
  if(!e.classList.contains('go'))return;
  if(e.classList.contains('open')){$('ov').classList.add('on');return}
  e.classList.add('open');$('hint').style.opacity=0;setTimeout(()=>$('ov').classList.add('on'),1600)};
$('ov').onclick=e=>{if(e.target===$('ov')||e.target===$('x'))$('ov').classList.remove('on')};
// Mensajes del panel de administración (vista previa en vivo)
addEventListener('message',e=>{const d=e.data;if(!d||!d.gift)return;Object.assign(GIFT,d.gift);render();
const B=document.body;$('ov').classList.remove('on');$('env').classList.remove('open');
if(d.play){B.classList.remove('pv');['fl','paper','env'].forEach(i=>$(i).classList.remove('go'));$('rain').classList.remove('on');$('hint').style.opacity=0;$('s').classList.remove('on');void $('s').offsetWidth;play()}
else{B.classList.add('pv');$('pin').style.display='none';$('s').classList.add('on');$('env').classList.add('go')}
parent.postMessage({thumbs:Object.fromEntries(GIFT.flores.map(f=>[f.t,`<svg viewBox="-42 -44 84 88" width="100%" height="100%">${T[f.t](f.c||'#fff')}</svg>`]))},'*')});
</script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="fb.js"></script>
<script>
window.buscar=async p=>{const s=await getDoc(doc(db,'regalos',p));return s.exists()?s.data():null};
</script></body></html>
